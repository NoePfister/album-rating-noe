<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Albumhub</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <div class="header-content">
            <div>
                <p class="eyebrow">Rate your Albums</p>
                <h1 id="page-title">Albumhub</h1>
            </div>

            <nav class="navigation">
                <button id="reviews-button" class="nav-button active">Reviews</button>
                <button id="albums-button" class="nav-button">Alben</button>
                <button id="users-button" class="nav-button">Users</button>
                <button id="new-releases-button" class="nav-button">New Releases</button>
            </nav>
        </div>
    </header>

    <main class="page-container">

        <!-- Diese Seite ist beim Start sichtbar. -->
        <section id="reviews-page">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Von der Community</p>
                    <h2>Neuste Reviews</h2>
                </div>
                <p>Was wurde zuletzt bewertet?</p>
            </div>

            <div id="reviews-list" class="review-list">
                <!-- Die Reviews werden mit JavaScript eingefügt. -->
            </div>
        </section>

        <!-- Diese beiden Seiten sind beim Start verborgen. -->
        <section id="albums-page" class="hidden">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Library</p>
                    <h2>Alben</h2>
                </div>
            </div>

            <div class="search-container">
                <input type="text" id="album-search" class="input" placeholder="Suche nach Album oder Künstler...">
            </div>

            <div id="albums-list" class="simple-list"></div>
        </section>

        <section id="users-page" class="hidden">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Community</p>
                    <h2>Users</h2>
                </div>
            </div>

            <div id="users-list" class="simple-list"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
